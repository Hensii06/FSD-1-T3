<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
        <title>Bootstrap 5 Offcanvas and Modal Demo</title>
    </head>
    <body>

        <div class="container mt-5 text-center">
            <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#1">
                Add to Cart
            </button>
        </div>

        <div class="offcanvas offcanvas-end" id="1">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Shopping Cart</h5>
                <button class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <p>Product has been added to your cart successfully.</p>
                <p>Would you like to proceed to checkout?</p>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#2">
                    Checkout
                </button>
            </div>
        </div>

        <div class="modal fade" id="2">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        Are you sure you want to proceed with the checkout?
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
