<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    </head>
    <body>
        <div id="mycarousel" class="carousel slide" data-bs-ride="carousel" data-bs-pause="hover">
            <div class="carousel-indicators">
                <button data-bs-target="#mycarousel" data-bs-slide-to="0" class="active">
                </button>
                <button data-bs-target="#mycarousel" data-bs-slide-to="1">
                </button>
                <button data-bs-target="#mycarousel" data-bs-slide-to="2">
                </button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="1000">
                    <img src="1.jpg" class="d-block w-100 h-75">
                    <div class="carousel-caption">
                        <h5>First Slide</h5>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus aperiam dolorum debitis, explicabo odio accusamus?</p>
                        <a href="#" class="btn btn-danger">View</a>
                    </div>
                </div>
                <div class="carousel-item" data-bs-interval="3000">
                    <img src="2.jpg" class="d-block w-100 h-75">
                    <div class="carousel-caption w-50 mx-auto">
                        <h5 class="text-black">Second Slide</h5>
                        <a href="#" class="btn btn-danger">View</a>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="3.jfif" class="d-block w-100 h-75">
                    <div class="carousel-caption w-50 mx-auto">
                        <h5 class="text-black">Third Slide</h5>
                        <p class="text-black">Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus aperiam dolorum debitis, explicabo odio accusamus?</p>
                        <a href="https://google.com" class="btn btn-danger">View</a>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" data-bs-target="#mycarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" data-bs-target="#mycarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </body>
</html>
